<svg xmlns="http://www.w3.org/2000/svg" width="680" height="360" font-family="Arial,Helvetica,sans-serif">
<rect width="680" height="360" fill="#fff" rx="6" stroke="#dee2e6" stroke-width="1"/>
<text x="340" y="24" text-anchor="middle" font-size="13" font-weight="bold" fill="#212529">Fig. 4 — reVISit-Inspired Architecture in This Study</text>
<text x="340" y="40" text-anchor="middle" font-size="9.5" fill="#6c757d">Mapping of reVISit components [Yildiz et al., 2023] to this implementation</text>

<!-- Column headers -->
<rect x="36" y="54" width="140" height="22" rx="4" fill="#e9ecef"/>
<text x="106" y="69" text-anchor="middle" font-size="10" font-weight="bold" fill="#495057">reVISit Component</text>

<rect x="192" y="54" width="220" height="22" rx="4" fill="#e9ecef"/>
<text x="302" y="69" text-anchor="middle" font-size="10" font-weight="bold" fill="#495057">reVISit Description</text>

<rect x="428" y="54" width="220" height="22" rx="4" fill="#e9ecef"/>
<text x="538" y="69" text-anchor="middle" font-size="10" font-weight="bold" fill="#2b6cb0">This Study's Implementation</text>

<!-- Row 1 -->
<rect x="36" y="82" width="140" height="54" rx="4" fill="#f3f0ff" stroke="#6741d9" stroke-width="1"/>
<text x="106" y="103" text-anchor="middle" font-size="10" font-weight="bold" fill="#6741d9">Study</text>
<text x="106" y="116" text-anchor="middle" font-size="10" font-weight="bold" fill="#6741d9">Configuration</text>
<text x="106" y="129" text-anchor="middle" font-size="9" fill="#495057">(JSON spec)</text>

<rect x="192" y="82" width="220" height="54" rx="4" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1"/>
<text x="302" y="99" text-anchor="middle" font-size="9.5" fill="#495057">Declarative study specification:</text>
<text x="302" y="113" text-anchor="middle" font-size="9.5" fill="#495057">trials, randomisation,</text>
<text x="302" y="127" text-anchor="middle" font-size="9.5" fill="#495057">question types, step order</text>

<rect x="428" y="82" width="220" height="54" rx="4" fill="#e7f3ff" stroke="#2b6cb0" stroke-width="1"/>
<text x="538" y="99" text-anchor="middle" font-size="9.5" fill="#2b6cb0">STEP_* constants + applyCondition()</text>
<text x="538" y="113" text-anchor="middle" font-size="9.5" fill="#2b6cb0">in study.js; fixed step order per</text>
<text x="538" y="127" text-anchor="middle" font-size="9.5" fill="#2b6cb0">condition</text>

<!-- Row 2 -->
<rect x="36" y="142" width="140" height="54" rx="4" fill="#fff0f6" stroke="#c2255c" stroke-width="1"/>
<text x="106" y="163" text-anchor="middle" font-size="10" font-weight="bold" fill="#c2255c">Stimulus</text>
<text x="106" y="176" text-anchor="middle" font-size="10" font-weight="bold" fill="#c2255c">Rendering</text>
<text x="106" y="189" text-anchor="middle" font-size="9" fill="#495057">(React / iframe)</text>

<rect x="192" y="142" width="220" height="54" rx="4" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1"/>
<text x="302" y="159" text-anchor="middle" font-size="9.5" fill="#495057">Interactive visualization rendered</text>
<text x="302" y="173" text-anchor="middle" font-size="9.5" fill="#495057">in browser; participant can interact</text>
<text x="302" y="187" text-anchor="middle" font-size="9.5" fill="#495057">before responding</text>

<rect x="428" y="142" width="220" height="54" rx="4" fill="#e7f3ff" stroke="#2b6cb0" stroke-width="1"/>
<text x="538" y="159" text-anchor="middle" font-size="9.5" fill="#2b6cb0">setViz() in study.js configures</text>
<text x="538" y="173" text-anchor="middle" font-size="9.5" fill="#2b6cb0">main.js chart; lockControls()</text>
<text x="538" y="187" text-anchor="middle" font-size="9.5" fill="#2b6cb0">disables irrelevant controls</text>

<!-- Row 3 -->
<rect x="36" y="202" width="140" height="54" rx="4" fill="#ebfbee" stroke="#2f9e44" stroke-width="1"/>
<text x="106" y="223" text-anchor="middle" font-size="10" font-weight="bold" fill="#2f9e44">Response</text>
<text x="106" y="236" text-anchor="middle" font-size="10" font-weight="bold" fill="#2f9e44">Collection</text>
<text x="106" y="249" text-anchor="middle" font-size="9" fill="#495057">(MCQ, Likert, free text)</text>

<rect x="192" y="202" width="220" height="54" rx="4" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1"/>
<text x="302" y="219" text-anchor="middle" font-size="9.5" fill="#495057">Typed input interfaces; response</text>
<text x="302" y="233" text-anchor="middle" font-size="9.5" fill="#495057">stored with trial metadata</text>
<text x="302" y="247" text-anchor="middle" font-size="9.5" fill="#495057">(index, timestamp)</text>

<rect x="428" y="202" width="220" height="54" rx="4" fill="#e7f3ff" stroke="#2b6cb0" stroke-width="1"/>
<text x="538" y="219" text-anchor="middle" font-size="9.5" fill="#2b6cb0">Task banner: MCQ radio buttons +</text>
<text x="538" y="233" text-anchor="middle" font-size="9.5" fill="#2b6cb0">−5/+5 Likert cells; saveAnswer()</text>
<text x="538" y="247" text-anchor="middle" font-size="9.5" fill="#2b6cb0">stores response + timestamps</text>

<!-- Row 4 -->
<rect x="36" y="262" width="140" height="54" rx="4" fill="#fff3bf" stroke="#e67700" stroke-width="1"/>
<text x="106" y="283" text-anchor="middle" font-size="10" font-weight="bold" fill="#e67700">Data</text>
<text x="106" y="296" text-anchor="middle" font-size="10" font-weight="bold" fill="#e67700">Management</text>
<text x="106" y="309" text-anchor="middle" font-size="9" fill="#495057">(export / dashboard)</text>

<rect x="192" y="262" width="220" height="54" rx="4" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1"/>
<text x="302" y="279" text-anchor="middle" font-size="9.5" fill="#495057">Session persistence; JSON / CSV</text>
<text x="302" y="293" text-anchor="middle" font-size="9.5" fill="#495057">export; researcher dashboard</text>
<text x="302" y="307" text-anchor="middle" font-size="9.5" fill="#495057">for review</text>

<rect x="428" y="262" width="220" height="54" rx="4" fill="#e7f3ff" stroke="#2b6cb0" stroke-width="1"/>
<text x="538" y="279" text-anchor="middle" font-size="9.5" fill="#2b6cb0">localStorage persistence; per-session</text>
<text x="538" y="293" text-anchor="middle" font-size="9.5" fill="#2b6cb0">JSON download; upload to</text>
<text x="538" y="307" text-anchor="middle" font-size="9.5" fill="#2b6cb0">researcher's OneDrive folder</text>

<!-- arrows between columns -->
<line x1="176" y1="109" x2="192" y2="109" stroke="#dee2e6" stroke-width="1"/>
<line x1="176" y1="169" x2="192" y2="169" stroke="#dee2e6" stroke-width="1"/>
<line x1="176" y1="229" x2="192" y2="229" stroke="#dee2e6" stroke-width="1"/>
<line x1="176" y1="289" x2="192" y2="289" stroke="#dee2e6" stroke-width="1"/>
<line x1="412" y1="109" x2="428" y2="109" stroke="#dee2e6" stroke-width="1"/>
<line x1="412" y1="169" x2="428" y2="169" stroke="#dee2e6" stroke-width="1"/>
<line x1="412" y1="229" x2="428" y2="229" stroke="#dee2e6" stroke-width="1"/>
<line x1="412" y1="289" x2="428" y2="289" stroke="#dee2e6" stroke-width="1"/>

<text x="340" y="348" text-anchor="middle" font-size="9.5" fill="#6c757d">Architecture inspired by: Yildiz et al. (2023) "reVISit: Towards a Platform for Conducting and Managing User Studies for Visualization"</text>
</svg>
