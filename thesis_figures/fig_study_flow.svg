<svg xmlns="http://www.w3.org/2000/svg" width="680" height="420" font-family="Arial,Helvetica,sans-serif">
<rect width="680" height="420" fill="#fff" rx="6" stroke="#dee2e6" stroke-width="1"/>
<text x="340" y="26" text-anchor="middle" font-size="13" font-weight="bold" fill="#212529">Fig. 1 — User Study Procedure Flow</text>

<!-- Step boxes -->
<!-- 1: Open tool -->
<rect x="260" y="48" width="160" height="40" rx="6" fill="#e7f3ff" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="340" y="63" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b6cb0">Open Tool</text>
<text x="340" y="79" text-anchor="middle" font-size="10" fill="#495057">Browser, any device</text>

<!-- arrow -->
<line x1="340" y1="88" x2="340" y2="104" stroke="#868e96" stroke-width="1.5" marker-end="url(#arr)"/>

<!-- 2: Consent -->
<rect x="260" y="104" width="160" height="40" rx="6" fill="#f3f0ff" stroke="#6741d9" stroke-width="1.5"/>
<text x="340" y="119" text-anchor="middle" font-size="11" font-weight="bold" fill="#6741d9">Informed Consent</text>
<text x="340" y="135" text-anchor="middle" font-size="10" fill="#495057">Checkbox agreement</text>

<line x1="340" y1="144" x2="340" y2="160" stroke="#868e96" stroke-width="1.5" marker-end="url(#arr)"/>

<!-- 3: Condition select -->
<rect x="240" y="160" width="200" height="40" rx="6" fill="#fff3bf" stroke="#e67700" stroke-width="1.5"/>
<text x="340" y="175" text-anchor="middle" font-size="11" font-weight="bold" fill="#e67700">Select Condition</text>
<text x="340" y="191" text-anchor="middle" font-size="10" fill="#495057">C1: Table vs. Visual  ·  C2: Axis Scales</text>

<!-- branch lines -->
<line x1="260" y1="180" x2="120" y2="240" stroke="#868e96" stroke-width="1.5"/>
<line x1="420" y1="180" x2="560" y2="240" stroke="#868e96" stroke-width="1.5"/>

<!-- C1 branch -->
<rect x="36" y="240" width="168" height="44" rx="6" fill="#fff0f6" stroke="#c2255c" stroke-width="1.5"/>
<text x="120" y="257" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#c2255c">Condition 1</text>
<text x="120" y="271" text-anchor="middle" font-size="9.5" fill="#495057">Baseline (table) →</text>
<text x="120" y="283" text-anchor="middle" font-size="9.5" fill="#495057">Line · Bar · Waffle</text>

<!-- C2 branch -->
<rect x="476" y="240" width="168" height="44" rx="6" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.5"/>
<text x="560" y="257" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2f9e44">Condition 2</text>
<text x="560" y="271" text-anchor="middle" font-size="9.5" fill="#495057">Linear scale →</text>
<text x="560" y="283" text-anchor="middle" font-size="9.5" fill="#495057">Scale break</text>

<!-- converge arrows -->
<line x1="120" y1="284" x2="280" y2="340" stroke="#868e96" stroke-width="1.5"/>
<line x1="560" y1="284" x2="400" y2="340" stroke="#868e96" stroke-width="1.5"/>

<!-- 5: Complete -->
<rect x="240" y="340" width="200" height="40" rx="6" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.5"/>
<text x="340" y="355" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f9e44">Completion</text>
<text x="340" y="371" text-anchor="middle" font-size="10" fill="#495057">Download JSON · Upload to OneDrive</text>

<!-- Per-task label inside each condition -->
<text x="120" y="308" text-anchor="middle" font-size="9" fill="#868e96" font-style="italic">4 tasks · MCQ + Likert</text>
<text x="560" y="308" text-anchor="middle" font-size="9" fill="#868e96" font-style="italic">3 tasks · MCQ + Likert</text>

<!-- arrow marker -->
<defs>
  <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
    <path d="M0,0 L0,6 L8,3 z" fill="#868e96"/>
  </marker>
</defs>

<!-- legend -->
<rect x="36" y="390" width="12" height="12" rx="2" fill="#e7f3ff" stroke="#2b6cb0" stroke-width="1"/>
<text x="53" y="401" font-size="9" fill="#495057">System step</text>
<rect x="130" y="390" width="12" height="12" rx="2" fill="#fff3bf" stroke="#e67700" stroke-width="1"/>
<text x="147" y="401" font-size="9" fill="#495057">Participant choice</text>
<rect x="250" y="390" width="12" height="12" rx="2" fill="#fff0f6" stroke="#c2255c" stroke-width="1"/>
<text x="267" y="401" font-size="9" fill="#495057">Condition-specific</text>
<rect x="390" y="390" width="12" height="12" rx="2" fill="#ebfbee" stroke="#2f9e44" stroke-width="1"/>
<text x="407" y="401" font-size="9" fill="#495057">Data export</text>
</svg>
